<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS - try the API</title>
<style>
 :root{--ink:#1f2933;--line:#d7dee6;--bg:#f6f8fa;--accent:#0b6bcb}
 body{margin:0;font:15px/1.5 Segoe UI,system-ui,sans-serif;color:var(--ink);background:#fff}
 header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
 header b{font-size:17px} header span{color:#5b6b7c}
 main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:0;min-height:calc(100vh - 56px)}
 @media(max-width:860px){main{grid-template-columns:1fr}}
 .calls{padding:18px 20px;border-right:1px solid var(--line);background:var(--bg)}
 .call{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;margin-bottom:12px}
 .call h3{margin:0 0 4px;font-size:14px} .call p{margin:0 0 8px;color:#5b6b7c;font-size:13px}
 .verb{font:12px/1 ui-monospace,Consolas,monospace;background:#eef3f8;color:var(--accent);padding:3px 6px;border-radius:4px}
 label{display:block;font-size:12px;color:#5b6b7c;margin:6px 0 2px}
 input{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:13px ui-monospace,Consolas,monospace}
 button{margin-top:8px;padding:7px 12px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;cursor:pointer}
 button.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
 .out{padding:18px 20px;overflow:auto}
 .status{font-size:13px;color:#5b6b7c;margin-bottom:8px}
 pre{margin:0;padding:12px;background:#0f172a;color:#e2e8f0;border-radius:8px;overflow:auto;max-height:70vh;
     font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
 .ticket{font:12px ui-monospace,Consolas,monospace;color:#1f7a4d;word-break:break-all}
 label.check{display:flex;align-items:center;gap:6px;margin:8px 0 0;color:#24303c;font-size:12.5px}
 label.check input{width:auto}
 .cmds{margin-bottom:12px}
 .cmdhead{display:flex;align-items:center;gap:10px;font-size:12px;color:#5b6b7c;margin-bottom:4px}
 .copy{margin:0;padding:3px 8px;font-size:12px;background:#fff;color:var(--accent);border:1px solid var(--accent)}
 #cmd{background:#f3f6f9;color:#24303c;border:1px solid var(--line);max-height:30vh}
</style></head><body>
<header><b>DMS - try the API</b><span>the four calls another system makes, as you, with your AD rights</span></header>
<main>
<section class="calls" id="calls"></section>
<section class="out">
  <div class="status" id="st">Nothing asked yet. Start with a ticket.</div>
  <div class="cmds" id="cmds">
    <div class="cmdhead">The call, with every parameter <button class="copy" onclick="copyAll()">Copy</button></div>
    <pre id="cmd">&nbsp;</pre>
  </div>
  <pre id="body">&nbsp;</pre>
</section>
</main>
<script>
// Every call, with every parameter it takes: the page is built from this, so what you see on screen is
// exactly what the API offers - and the address below is built from the boxes as you fill them in.
const CALLS = [
  { id: 'ticket', verb: 'GET', path: '/api/ai/index-ticket', button: 'Get a ticket',
    what: 'A ticket in your name. Every call below uses it, and it never says whose it is.',
    params: [] },
  { id: 'docs', verb: 'GET', path: '/api/v1/approved-documents', button: 'Ask',
    what: 'What is released, as you may see it.',
    params: [
      { name: 'ticket', kind: 'ticket', note: 'in your name (or X-DMS-Index-Ticket, or an application key)' },
      { name: 'q', kind: 'text', note: 'part of an id, a name or a file name' },
      { name: 'customer', kind: 'text', note: 'only that customer\'s documents' },
      { name: 'since', kind: 'text', note: '2026-11-15T08:00:00Z - only what changed after it' },
      { name: 'all', kind: 'bool', value: true, note: 'also released files with no Markdown (a drawing, a scan)' },
      { name: 'inline', kind: 'bool', value: true, note: 'carry the Markdown in the answer - nothing is downloaded' },
      { name: 'budget', kind: 'number', value: 200000, note: 'how much Markdown one answer may carry' } ] },
  { id: 'structure', verb: 'GET', path: '/api/v1/structure', button: 'Ask',
    what: 'The departments and the customers, each with its KPIs folder.',
    params: [
      { name: 'ticket', kind: 'ticket' },
      { name: 'q', kind: 'text', note: 'part of a name' } ] },
  { id: 'file', verb: 'GET', path: '/api/v1/file', button: 'Fetch', raw: true,
    what: 'The file itself, served by the DMS. Paste a path from an answer above.',
    params: [
      { name: 'ticket', kind: 'ticket' },
      { name: 'path', kind: 'text', wide: true, required: true,
        note: 'E:\\Shares\\01_General\\...\\Current_ReadOnly\\QP-16.1 Rev03.docx' },
      { name: 'markdown', kind: 'bool', value: true, note: 'the Markdown beside it, rather than the document' } ] },
];

let ticket = '';
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function draw() {
  $('calls').innerHTML = CALLS.map(call => `
    <div class="call">
      <h3><span class="verb">${call.verb}</span> ${esc(call.path)}</h3>
      <p>${esc(call.what)}</p>
      ${call.params.map(p => p.kind === 'bool' ? `
        <label class="check"><input type="checkbox" id="${call.id}-${p.name}" ${p.value ? 'checked' : ''}
          oninput="preview('${call.id}')"> ${esc(p.name)}${p.note ? ' - ' + esc(p.note) : ''}</label>` : `
        <label>${esc(p.name)}${p.required ? '' : ' (optional)'}${p.kind === 'ticket' ? ' - filled in by Get a ticket' : ''}</label>
        <input id="${call.id}-${p.name}" value="${p.value !== undefined ? esc(p.value) : ''}"
               placeholder="${esc(p.note || '')}" oninput="preview('${call.id}')"
               ${p.kind === 'ticket' ? 'readonly' : ''}>`).join('')}
      <button onclick="run('${call.id}')">${esc(call.button)}</button>
      <button class="ghost" onclick="preview('${call.id}')">Show the call</button>
    </div>`).join('');
  CALLS.forEach(c => preview(c.id, true));
}

function urlOf(id) {
  const call = CALLS.find(c => c.id === id);
  const q = [];
  for (const p of call.params) {
    const el = $(`${id}-${p.name}`);
    if (!el) continue;
    const v = p.kind === 'bool' ? (el.checked ? 'true' : '') : el.value.trim();
    if (v) q.push(encodeURIComponent(p.name) + '=' + encodeURIComponent(v));
  }
  return call.path + (q.length ? '?' + q.join('&') : '');
}

function showCall(url, raw) {
  const full = new URL(url, location.origin).href;
  const noTicket = full.replace(/([?&])ticket=[^&]*/, '$1').replace(/[?&]$/, '').replace(/\?&/, '?');
  $('cmd').textContent = [
    'GET ' + full, '',
    '# curl - the ticket in the address',
    'curl -s "' + full + '"', '',
    '# curl - the ticket as a header instead',
    'curl -s -H "X-DMS-Index-Ticket: ' + (ticket || '<ticket>') + '" "' + noTicket + '"', '',
    '# PowerShell, signed in as you',
    'Invoke-RestMethod "' + full + '" -UseDefaultCredentials' + (raw ? ' -OutFile .\\answer.bin' : ''), '',
    '# an application instead of a person: its own key, no ticket',
    'curl -s -H "X-DMS-Api-Key: <key>" "' + noTicket + '"',
  ].join('\n');
}

function preview(id, quiet) {
  showCall(urlOf(id), CALLS.find(c => c.id === id).raw);
  if (!quiet) $('st').textContent = 'the call below is ready - press ' + CALLS.find(c => c.id === id).button;
}

async function run(id) {
  const call = CALLS.find(c => c.id === id);
  const url = urlOf(id);
  showCall(url, call.raw);
  const t0 = performance.now();
  try {
    const r = await fetch(url, { credentials: 'include' });
    const ms = Math.round(performance.now() - t0);
    const kind = r.headers.get('content-type') || '';
    if (!kind.includes('json') && !kind.startsWith('text/')) {
      // a document, not something to read here: the DMS keeps no copy, so the browser decides where it
      // goes - exactly as curl -o or -OutFile would in whatever calls this for real
      const blob = await r.blob();
      const name = (r.headers.get('content-disposition') || '').split("''").pop() || 'file';
      const href = URL.createObjectURL(blob);
      $('st').textContent = `${r.status} ${r.statusText} - ${ms} ms, ${blob.size.toLocaleString()} bytes, ${kind}`;
      $('body').innerHTML = 'The document itself came back. Nothing was written on the server - the DMS ' +
        'keeps no copy.<br><br><a download="' + esc(decodeURIComponent(name)) + '" href="' + href + '">Save ' +
        esc(decodeURIComponent(name)) + '</a>';
      return;
    }
    const text = await r.text();
    const size = new Blob([text]).size;
    let shown = text;
    if (kind.includes('json')) {
      try {
        const j = JSON.parse(text);
        shown = JSON.stringify(j, null, 1);
        if (id === 'ticket') {
          ticket = j.ticket || '';
          CALLS.forEach(c => { const el = $(`${c.id}-ticket`); if (el) el.value = ticket; });
          CALLS.forEach(c => preview(c.id, true));
        }
      } catch (e) { /* not JSON after all */ }
    }
    $('st').textContent = `${r.status} ${r.statusText} - ${ms} ms, ${size.toLocaleString()} bytes`;
    $('body').textContent = shown.slice(0, 20000);
    $('body').removeAttribute('style');
  } catch (e) { $('st').textContent = 'failed'; $('body').textContent = e.message; }
}

function copyAll() {
  navigator.clipboard.writeText($('cmd').textContent).then(() => { $('st').textContent = 'copied'; }, () => {});
}
draw();
</script></body></html>
