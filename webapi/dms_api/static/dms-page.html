<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH - Documents Management System</title>
<style>
  :root { --navy:#1f4a72; --btn:#2a5279; --teal:#3db7b3; --ink:#1d2733; --muted:#6b7684; --line:#d7dde4; --bg:#ffffff; --band:#eef4fa;
          --ok:#1f7a3d; --okbg:#e3f4e8; --warn:#8a5a00; --warnbg:#fff3d6; --info:#1f5fa8; --infobg:#e4eefb; --err:#b42318; --errbg:#fde8e6; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 Roboto, "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { height:76px; display:flex; align-items:center; gap:20px; padding:0 28px; background:#fff; box-shadow:0 2px 10px rgba(31,74,114,.12); position:relative; z-index:2; }
  .brand { display:flex; align-items:center; gap:22px; }
  .sep { width:1px; height:26px; background:#9fb0c2; }
  .welcome { font-weight:700; font-size:19px; color:var(--navy); letter-spacing:.2px; }
  .spacer { flex:1; }
  .hbtn { display:flex; align-items:center; gap:6px; color:var(--navy); background:none; border:none; font:inherit; cursor:pointer; padding:6px; }
  .hbtn.muted { color:var(--muted); cursor:default; }
  .menu { position:relative; }
  .menu-list { position:absolute; inset-inline-end:0; top:36px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.12); min-width:190px; display:none; }
  .menu-list.open { display:block; }
  .menu-list button { display:block; width:100%; text-align:start; padding:10px 14px; background:none; border:none; font:inherit; cursor:pointer; color:var(--ink); }
  .menu-list button:hover { background:var(--band); }
  .band { background:linear-gradient(var(--band), #fff 90px); padding:40px 16px 40px; min-height:calc(100vh - 76px); }
  .card { max-width:1570px; margin:0 auto 22px; background:#fff; border-radius:8px; box-shadow:0 2px 12px rgba(31,74,114,.10); padding:22px 24px; }
  .card h2 { margin:0 0 8px; font-size:18px; color:var(--navy); }
  .radios { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:8px; }
  .radios label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .radios input { accent-color:var(--navy); width:17px; height:17px; margin:0; }
  .searchrow { display:flex; gap:16px; align-items:center; }
  .searchbox { flex:1; position:relative; }
  .searchbox input { width:100%; height:47px; border:1px solid var(--line); border-radius:6px; padding:0 44px 0 12px; font:inherit; color:var(--ink); }
  [dir=rtl] .searchbox input { padding:0 12px 0 44px; }
  .searchbox svg { position:absolute; inset-inline-end:12px; top:13px; }
  .pillbtn { height:47px; min-width:150px; border-radius:24px; background:var(--btn); color:#fff; border:none; font:inherit; font-weight:500; cursor:pointer; padding:0 26px; }
  .pillbtn:disabled { opacity:.5; cursor:default; }
  .pillbtn.small { height:38px; min-width:0; padding:0 20px; }
  .pillbtn.light { background:#e8eef5; color:var(--navy); }
  .refresh { display:inline-flex; gap:5px; align-items:center; color:var(--info); font-size:13px; margin-top:6px; background:none; border:none; cursor:pointer; padding:0; }
  .crumbs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; color:var(--muted); margin-bottom:12px; }
  .crumbs a { color:var(--info); cursor:pointer; }
  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
  .tile { border:1px solid var(--line); border-radius:8px; padding:14px; cursor:pointer; display:flex; gap:10px; align-items:center; color:var(--navy); font-weight:500; background:#fff; text-align:start; font:inherit; }
  .tile:hover { border-color:var(--btn); box-shadow:0 2px 8px rgba(31,74,114,.12); }
  .tile.folder { align-items:flex-start; width:100%; }
  .tl { display:grid; gap:2px; } .hint { font-size:12.5px; color:var(--muted); font-weight:400; } .fname { font-size:11.5px; color:#98a2ae; font-weight:400; }
  .tilewrap { display:grid; gap:4px; } .tileacts { font-size:13px; padding:0 4px; } .tileacts button { margin-inline-end:10px; }
  .levels { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .levels .gtitle { font-weight:600; color:var(--navy); margin-inline-end:4px; }
  .levels select { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); max-width:260px; }
  .levels select:last-child:has(option[value=""]:checked) { border-color:var(--btn); box-shadow:0 0 0 2px rgba(42,82,121,.15); }
  .lsep { color:var(--muted); }
  .hbtn.ai { color:#6d3fc0; font-weight:500; } button.link.ai { color:#6d3fc0; }
  .drawer { position:fixed; top:0; inset-inline-end:0; height:100vh; width:min(460px, 100vw); background:#fff; box-shadow:-8px 0 30px rgba(20,35,55,.18);
            transform:translateX(110%); transition:transform .2s; z-index:20; display:flex; flex-direction:column; }
  [dir=rtl] .drawer { transform:translateX(-110%); }
  .drawer.open { transform:none !important; }
  .dr-h { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); font-weight:700; color:#6d3fc0; font-size:17px; }
  .dr-ctx { padding:10px 18px; background:#f5f1fc; display:flex; gap:10px; justify-content:space-between; align-items:center; font-size:14px; }
  .dr-q { padding:10px 18px 0; display:flex; flex-wrap:wrap; gap:6px; }
  .dr-log { flex:1; overflow:auto; padding:14px 18px; display:flex; flex-direction:column; gap:10px; }
  .bubble { padding:10px 12px; border-radius:10px; max-width:90%; white-space:normal; line-height:1.5; }
  .bubble.me { align-self:flex-end; background:var(--infobg); }
  .bubble.bot { align-self:flex-start; background:#f4f5f7; }
  .bubble .src { margin-top:6px; font-size:12px; color:var(--muted); }
  .dr-in { display:flex; gap:8px; padding:12px 18px 16px; border-top:1px solid var(--line); align-items:flex-end; }
  .dr-in textarea { flex:1; font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; resize:vertical; }
  .rag-frame { width:100%; height:60vh; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .dr-tabs { display:flex; gap:4px; padding:10px 18px 0; }
  .dr-tabs button { flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px; font:inherit; cursor:pointer; color:var(--ink); }
  .dr-tabs button.on { border-color:#6d3fc0; color:#6d3fc0; font-weight:600; background:#f5f1fc; }
  .bubble.wide { max-width:100%; width:100%; }
  .sugg { border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:#fff; margin-top:8px; display:grid; gap:3px; }
  .sg-n { font-weight:500; } .sg-r { color:#5b3aa0; } .sg-a button, .sg-a a { margin-inline-end:12px; }
  .sugg-list { display:grid; gap:4px; }
  .pg-banner { background:#fff3d6; color:#7a5200; padding:8px 28px; font-size:13.5px; border-bottom:1px solid #f0dca6; }
  .badge { background:var(--err); color:#fff; border-radius:9px; font-size:11px; padding:0 6px; min-width:18px; text-align:center; }
  .pg-banner.live { background:#e3f4e8; color:#1f5f33; border-bottom-color:#bfe3c9; }
  .pg button { margin-inline-end:10px; }
  .pf-res { background:var(--band); border-radius:8px; padding:10px 12px; }
  .pf-path { font-weight:600; color:var(--navy); word-break:break-all; }
  .flform { display:grid; gap:10px; max-width:900px; }
  .flform label { display:grid; gap:4px; color:var(--muted); font-size:13px; }
  .flform .row { display:flex; gap:10px; align-items:flex-end; width:100%; }
  .flform label.chk { display:flex; gap:8px; align-items:center; color:var(--ink); font-size:14px; }
  .flform input[type=text], .flform select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:16px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; color:var(--ink); }
  .chip.on { border-color:var(--btn); box-shadow:0 0 0 2px rgba(42,82,121,.15); }
  .Rejected { background:var(--errbg); color:var(--err); }
  .timeline { margin:4px 0; padding-inline-start:20px; display:grid; gap:6px; }
  .guide { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--band); border-radius:8px; padding:10px 14px; margin-bottom:12px; }
  .guide .gtitle { font-weight:600; color:var(--navy); }
  .guide select { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; min-width:220px; background:#fff; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:start; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  td.actions { white-space:nowrap; }
  td.actions a, td.actions button.link { margin-inline-end:12px; }
  a.link, button.link { color:var(--info); cursor:pointer; text-decoration:none; background:none; border:none; font:inherit; padding:0; }
  .status { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12.5px; font-weight:500; }
  .Working { background:var(--warnbg); color:var(--warn); } .Submitted { background:var(--infobg); color:var(--info); }
  .Approved_ReadOnly { background:var(--okbg); color:var(--ok); } .None, .Other { background:#f0f2f5; color:var(--muted); }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .msg { padding:10px 12px; border-radius:6px; margin-bottom:12px; } .msg.ok { background:var(--okbg); color:var(--ok); } .msg.err { background:var(--errbg); color:var(--err); }
  dialog { border:none; border-radius:10px; padding:0; width:min(560px, 94vw); box-shadow:0 12px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(20,35,55,.35); }
  .dlg-h { padding:16px 20px; border-bottom:1px solid var(--line); font-weight:700; color:var(--navy); }
  .dlg-b { padding:16px 20px; display:grid; gap:12px; }
  .dlg-f { padding:12px 20px 18px; display:flex; gap:10px; justify-content:flex-end; }
  .dlg-b label { display:grid; gap:4px; color:var(--muted); font-size:13px; }
  .dlg-b input[type=text], .dlg-b select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  .ltr { direction:ltr; unicode-bidi:plaintext; }
  .icon { flex:none; }
  /* ---------------- adaptive layout: desktop, tablet, phone */
  html, body { overflow-x:clip; }
  @media (max-width:1100px) {
    header { gap:12px; padding:0 18px; }
    #wf-t, #lang-t { display:none; }                      /* icons only; the title stays in the tooltip */
    .hbtn { white-space:nowrap; } .brand { min-width:0; } .welcome { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card { padding:18px; }
    td.actions { white-space:normal; } td.actions a, td.actions button.link { display:inline-block; margin-block:2px; }
  }
  @media (max-width:760px) {
    header { height:auto; min-height:58px; flex-wrap:wrap; padding:6px 10px; gap:4px; }
    .brand { gap:10px; min-width:0; flex:1 1 auto; } .sep { display:none; }
    .welcome { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .spacer { display:none; }
    #ap-t, #wf-t, #ai-t, #lang-t, #who { display:none; }
    .hbtn { padding:8px; }
    .pg-banner { padding:8px 12px; font-size:13px; }
    .band { padding:12px 8px 24px; min-height:auto; }
    .card { padding:14px 12px; margin-bottom:12px; }
    .searchrow { flex-direction:column; align-items:stretch; gap:10px; } .searchrow .pillbtn { width:100%; }
    .toolbar { flex-wrap:wrap; gap:8px; } .toolbar .spacer { display:none; }
    .toolbar .pillbtn { flex:1 1 auto; padding:0 12px; }
    .grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
    .tile { padding:11px; }
    .levels select, .guide select { flex:1 1 140px; max-width:100%; min-width:0; }
    .lsep { display:none; }
    td.hide-s, th.hide-s { display:none; }
    /* tables become one card per row */
    table, tbody, tr, td { display:block; width:100%; }
    tr:has(> th) { display:none; }
    tr[hidden] { display:none; }
    tr { border-bottom:1px solid var(--line); padding:8px 2px; }
    td { border:none; padding:2px 0; }
    td.actions { white-space:normal; display:flex; flex-wrap:wrap; gap:6px 14px; padding-top:6px; }
    td.actions a, td.actions button.link { margin:0; }
    .flform .row { flex-direction:column; align-items:stretch; }
    .dlg-f { flex-wrap:wrap; } .dlg-f .pillbtn { flex:1 1 auto; }
    .dr-tabs { padding:8px 10px 0; } .dr-tabs button { padding:6px 4px; font-size:13px; }
    .dr-h, .dr-ctx, .dr-log, .dr-in { padding-inline:12px; }
    .rag-frame { height:55vh; }
  }
</style>
</head>

    <div class="menu-list" id="menu"></div></div>
</header>

<div class="pg-banner" id="pg" hidden></div>
<div class="band">
  <section class="card">
    <h2 id="t-search"></h2>

      <div class="searchbox"><input id="q" autocomplete="off"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6675" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></div>

    <button class="refresh" id="refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span id="t-refresh"></span></button>
  </section>
  <section class="card" id="view"></section>
</div>

<aside id="ai-panel" class="drawer" aria-hidden="true">

  <div class="dr-q" id="ai-quick"></div>
  <div class="dr-log" id="ai-log"></div>
  <form class="dr-in" id="ai-form"><textarea id="ai-q" rows="2"></textarea><button class="pillbtn small" id="ai-send"></button></form>
</aside>

// ---------------------------------------------------------------- api (Windows sign-in by default: the browser sends the login)
async function token() {
  if (cfg.authMode !== 'entra') return null;
  try { return (await msal.acquireTokenSilent({ scopes:[cfg.scope], account })).accessToken; }
  catch { await msal.acquireTokenRedirect({ scopes:[cfg.scope], account }); }
}
async function api(path, opts = {}) {
  const t = await token();
  const headers = { ...(opts.body && !(opts.body instanceof FormData) ? { 'Content-Type':'application/json' } : {}), ...(t ? { Authorization:'Bearer ' + t } : {}) };
  const r = await fetch(path, { credentials:'include', ...opts, headers });
  const body = r.headers.get('content-type')?.includes('json') ? await r.json() : null;
  if (!r.ok) throw new Error(typeof body?.detail === 'string' ? body.detail : (body?.detail?.message || r.statusText));
  return body;
}

  return `<div class="levels"><span class="gtitle">${T.location}</span>${lv.map((l, i) => `${i ? `<span class="lsep">${lang === 'HE' ? '‹' : '›'}</span>` : ''}<select data-level="${i}">
      ${l.selected ? '' : `<option value="">${T.choose}</option>`}
      ${l.options.map(o => `<option value="${esc(o.path)}" ${o.name === l.selected ? 'selected' : ''}>${esc(lbl(o.label) || o.name)}</option>`).join('')}</select>`).join('')}</div>`;
}
function wireLevels(v) {
  v.querySelectorAll('[data-level]').forEach(sel => sel.onchange = () => {
    if (!sel.value) return;
    state.view = 'browse'; state.folder = sel.value; render();
  });
}
const hint = l => l ? (lang === 'HE' ? l.hintHe : l.hintEn) : '';
function folderTile(f) {
  const l = f.label, title = lbl(l) || f.name;
  return `<button type="button" class="tile folder" data-f="${esc(f.path)}">${l && l.kind === 'customer' ? ICON_CUST : ICON_FOLDER}
    <span class="tl"><span>${esc(title)}</span>${hint(l) ? `<span class="hint">${esc(hint(l))}</span>` : ''}${title !== f.name ? `<span class="fname ltr">${esc(f.name)}</span>` : ''}</span></button>`;
}
async function browse(v) {
  const r = await api('/api/browse?path=' + encodeURIComponent(state.folder));
  state.folder = r.path; state.ctx = r.context;
  const folders = r.folders.filter(f => !['Submitted','Working'].includes(f.name));
  r.files.forEach(f => f.managed = r.managed);
  const bar = await levelBar(r.path);
  v.innerHTML = `<div class="crumbs"><a data-home>⌂ ${T.home}</a></div>${bar}
    ${r.node && hint(r.node) ? `<p class="muted" style="margin:-4px 0 12px">${esc(hint(r.node))}</p>` : ''}
    ${r.context.customer ? guideBar(r.context) : ''}
    ${r.managed ? `<div class="msg" style="background:var(--band)">🔒 ${T.managedNote}</div>` : ''}
    <div class="toolbar"><button type="button" class="pillbtn small light" id="pf-b">🧭 ${T.pathFinder}</button><button type="button" class="pillbtn small light" data-cp="${esc(state.folder || '')}">🔗 ${T.copyLink}</button><span class="spacer"></span>${r.canWrite ? `<button type="button" class="pillbtn small light" id="mk">${T.newFolder}</button><button type="button" class="pillbtn small light" id="up">${T.upload}</button><button type="button" class="pillbtn small" id="nd">＋ ${T.newDoc}</button>` : ''}</div>
    ${folders.length ? `<div class="grid" style="margin-bottom:16px">${folders.map(f => `<div class="tilewrap">${folderTile(f)}${f.workflowFolder ? `<div class="tileacts muted">🔒 ${T.managed}</div>` : (r.canWrite && !f.label ? `<div class="tileacts">${editActions(f)}</div>` : '')}</div>`).join('')}</div>` : ''}
    ${r.files.length ? `<table><tr><th>${T.name}</th><th>${T.status}</th><th class="hide-s">${T.modified}</th><th></th></tr>
    ${r.files.map(f => `<tr><td><span style="display:inline-flex;gap:8px;align-items:center">${ICON_FILE}${esc(f.name)}</span></td><td>${statusTag(f.document)}</td><td class="hide-s muted">${when(f.modified)}</td><td class="actions">${fileActions(f)}${r.canWrite && !f.document && !f.readOnly ? editActions(f) : ''}</td></tr>`).join('')}
    </table>` : ''}${folders.length + r.files.length ? '' : `<p class="muted">${T.none}</p>`}`;
  v.querySelector('[data-home]').onclick = () => { state.view = 'customers'; render(); };
  v.querySelector('#pf-b').onclick = () => pathFinder(r.path);
  if (r.canWrite) { v.querySelector('#nd').onclick = () => newDocument(r.path); v.querySelector('#up').onclick = () => uploadDialog(r.path); v.querySelector('#mk').onclick = () => newFolderDialog(r.path); }
  v.querySelectorAll('[data-rn]').forEach(b => b.onclick = () => renameDialog(b.dataset.rn));
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteItem(b.dataset.del));
  wireLevels(v);
  if (r.context.customer) wireGuide(v, r.context);
}

// "What are you saving?" - takes the user to the blueprint folder for that kind of document
let guideKinds = null;
function guideBar(ctx) {
  return `<div class="guide"><span class="gtitle">${T.whatSaving}</span>
    <select id="g-kind"><option value="">${T.chooseKind}</option></select>
    <select id="g-proj" style="display:none"></select>
    <button type="button" class="pillbtn small" id="g-go" disabled>${T.takeMe}</button><span id="g-msg" class="muted small"></span></div>`;
}
async function wireGuide(v, ctx) {
  guideKinds = guideKinds || await api('/api/guide');
  const kind = v.querySelector('#g-kind'), proj = v.querySelector('#g-proj'), go = v.querySelector('#g-go'), msg = v.querySelector('#g-msg');
  kind.innerHTML += guideKinds.map(g => `<option value="${g.key}">${esc(lang === 'HE' ? g.he : g.en)}${g.needsProject ? ' ▸' : ''}</option>`).join('');
  kind.onchange = async () => {
    const g = guideKinds.find(x => x.key === kind.value);
    go.disabled = !g; msg.textContent = '';
    proj.style.display = 'none';
    if (g && g.needsProject && !ctx.project) {
      const list = await api('/api/projects?customer=' + encodeURIComponent(ctx.customer.path));
      proj.innerHTML = `<option value="">${T.chooseProject}</option>` + list.map(p => `<option value="${esc(p.path)}">${esc(p.name)}</option>`).join('');
      proj.style.display = ''; go.disabled = true;
      if (!list.length) msg.textContent = T.noProjects;
    }
  };
  proj.onchange = () => go.disabled = !proj.value;
  go.onclick = async () => {
    const g = guideKinds.find(x => x.key === kind.value);
    const qs = `key=${g.key}&customer=${encodeURIComponent(ctx.customer.path)}` + (g.needsProject ? `&project=${encodeURIComponent(ctx.project ? ctx.project.path : proj.value)}` : '');
    try {
      let t = await api('/api/guide/target?' + qs);
      if (!t.exists) {
        if (!confirm(T.createMissing)) return;
        t = await api('/api/guide/create?' + qs, { method:'POST' });
      }
      state.folder = t.path; await render();
      if (t.canWrite) uploadDialog(t.path);
    } catch (e) { msg.textContent = `${T.err}: ${e.message}`; }
  };
}

// Path finder: build a path level by level from the blueprint, including folders that do not exist yet
async function pathFinder(start, onPick) {
  const root = (cfg.repositoryRoot || '').replace(/[\\/]$/, '');
  const sep = root.includes('\\') ? '\\' : '/';
  // the chain of selected folders from the root down to `start`
  let chain = [];
  if (start && root && start.toLowerCase().startsWith(root.toLowerCase())) {
    const parts = start.slice(root.length).split(/[\\/]/).filter(Boolean);
    chain = parts.map((_, i) => root + sep + parts.slice(0, i + 1).join(sep));
  }
  $('#dlg-h').textContent = '🧭 ' + T.pathFinder;
  $('#dlg-f').innerHTML = `<button class="pillbtn small light" value="close">${T.pfClose}</button>`;
  $('#dlg-form').onsubmit = e => { e.preventDefault(); $('#dlg').close(); };
  if (!$('#dlg').open) $('#dlg').showModal();
  async function draw() {
    const levels = [];
    for (let i = 0; i <= chain.length; i++) {
      const at = i ? chain[i - 1] : null;
      const r = await api('/api/pathfinder' + (at ? '?path=' + encodeURIComponent(at) : ''));
      levels.push({ r, selected: chain[i] });
      if (!r.options.length) break;
    }
    const last = levels[levels.length - 1].r;
    const here = chain.length ? (levels[chain.length] ? levels[chain.length].r : last) : null;
    const target = chain[chain.length - 1];
    const exists = here ? here.exists : false;
    $('#dlg-b').innerHTML = `<p class="muted small" style="margin:0">${T.pfIntro}</p>
      ${levels.map((l, i) => l.r.options.length ? `<label>${i ? esc(lbl(l.r.node) || l.r.relative.split(/[\\/]/).pop()) : T.location}
        <select data-pf="${i}"><option value="">${T.choose}</option>${l.r.options.map(o => `<option value="${esc(o.path)}" ${o.path === l.selected ? 'selected' : ''}>${esc(lbl(o.label) || o.name)}${o.exists ? '' : ` (${T.pfNew})`}</option>`).join('')}</select></label>` : '').join('')}
      ${target ? `<div class="pf-res"><div class="muted small">${T.pfResult}</div><div class="ltr pf-path">${esc(target.slice(root.length).replace(/^[\\/]/, ''))}</div>
        ${exists ? '' : `<div class="small" style="color:var(--warn)">${T.pfMissing}</div>`}
        <div class="row" style="margin-top:8px">
          ${exists ? `<button type="button" class="pillbtn small" id="pf-go">${T.pfGo}</button>` : `<button type="button" class="pillbtn small" id="pf-create">${T.pfCreate}</button>`}
          ${exists && here.canWrite ? `<button type="button" class="pillbtn small light" id="pf-up">${T.pfUpload}</button>` : ''}
          <button type="button" class="pillbtn small light" id="pf-copy">${T.copy}</button></div></div>` : ''}`;
    $('#dlg-b').querySelectorAll('[data-pf]').forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.pf;
      chain = chain.slice(0, i);
      if (sel.value) chain.push(sel.value);
      draw().catch(e => note(`${T.err}: ${esc(e.message)}`, 'err'));
    });
    const go = path => { $('#dlg').close(); if (onPick) return onPick(path); state.view = 'browse'; state.folder = path; render(); };
    const g = $('#pf-go'); if (g) g.onclick = () => go(target);
    const u = $('#pf-up'); if (u) u.onclick = async () => { go(target); setTimeout(() => uploadDialog(target), 400); };
    const cr = $('#pf-create'); if (cr) cr.onclick = async () => {
      try { await api('/api/pathfinder/create?path=' + encodeURIComponent(target), { method:'POST' }); go(target); }
      catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); }
    };
    const cp = $('#pf-copy'); if (cp) cp.onclick = async () => { await copyText(target); cp.textContent = T.copied; };
  }
  try { await draw(); } catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); }
}

          <td>${esc(r.documentId)}<div class="muted small">${esc(r.documentType || "")}</div></td><td>${esc(r.revision)}</td><td class="small" style="${r.result.startsWith('error') ? 'color:var(--err)' : ''}">${esc(r.result)}</td><td class="small">${esc(r.fileLinker)}</td></tr>`).join('')}</table>`;
    } catch (x) { out.innerHTML = `<div class="msg err">${T.err}: ${esc(x.message)}</div>`; }

// ---------------------------------------------------------------- AI Insights (RH on-prem RAG LLM)
let aiOn = true, aiApi = false, ragTools = [], aiUrl = 'https://chat.ai.rh-global.com', aiFile = null, aiMode = 'ask';
async function findFiles(question) { return api('/api/ai/find', { method:'POST', body:JSON.stringify({ question, lang }) }); }
function suggestionHtml(x) {
  const loc = x.relative.split(/[\\/]/).slice(0, -1).join(' › ');
  return `<div class="sugg"><div class="sg-n">${esc(x.name)} ${x.document ? statusTag(x.document) : ''}</div>
    <div class="muted small ltr">${esc(loc)}</div>${x.reason ? `<div class="small sg-r">${esc(x.reason)}</div>` : ''}
    <div class="small sg-a">${x.officeUri ? `<a class="link" href="${esc(x.officeUri)}">${T.open}</a>` : ''}

const planText = p => [p.customer, p.project].filter(Boolean).join(lang === 'HE' ? ' ‹ ' : ' › ');
async function smartResults(v, text) {
  const r = await findFiles(text);
  v.innerHTML = `<h2>${T.found} (${r.suggestions.length})</h2>${planText(r.plan) ? `<p class="muted small">${T.searchedIn} ${esc(planText(r.plan))}</p>` : ''}
    ${r.suggestions.length ? `<div class="sugg-list">${r.suggestions.map(suggestionHtml).join('')}</div>` : `<p class="muted">${T.noneFound}</p>`}`;
}
function setMode(m) {
  aiMode = m;
  document.querySelectorAll('.dr-tabs [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  const rag = ragTools.find(r => 'rag:' + r.tool === m);
  $('#ai-q').placeholder = m === 'find' ? T.findPh : rag ? T.ragPh.replace('{tool}', rag.tool.toUpperCase()) : T.aiPlaceholder;
  $('#ai-send').textContent = m === 'find' ? T.go : T.aiAsk;
  $('#ai-quick').hidden = m !== 'ask';
  if (rag) { $('#ai-ctx').innerHTML = `${T.aiAbout} <b>${T.ragAbout.replace('{tool}', esc(rag.tool.toUpperCase()))}</b> <a class="link small" href="${esc(rag.page)}" target="_blank" rel="noopener">${esc(rag.tool.toUpperCase())} ↗</a>`; $('#ai-clear').hidden = true; }
  else if (m === 'find') { $('#ai-ctx').innerHTML = esc(T.findCtx); $('#ai-clear').hidden = true; }
  else { $('#ai-ctx').innerHTML = `${T.aiAbout} <b>${esc(aiFile ? aiFile.split(/[\\/]/).pop() : T.aiKnowledge)}</b>`; $('#ai-clear').hidden = !aiFile; }
}
async function findInPanel(question) {
  const log = $('#ai-log');
  log.insertAdjacentHTML('beforeend', `<div class="bubble me">🔎 ${esc(question)}</div><div class="bubble bot pending wide">${T.aiThinking}</div>`);
  const pending = log.querySelector('.pending');
  try {
    const r = await findFiles(question);
    pending.innerHTML = (planText(r.plan) ? `<div class="muted small">${T.searchedIn} ${esc(planText(r.plan))}</div>` : '')
      + (r.suggestions.length ? r.suggestions.map(suggestionHtml).join('') : esc(T.noneFound));
    wire(pending);
  } catch (e) { pending.innerHTML = `<span style="color:var(--err)">${T.err}: ${esc(e.message)}</span>`; }
  pending.classList.remove('pending'); log.scrollTop = log.scrollHeight;
}
function openAI(path) {
  aiFile = path || null;
  $('#ai-ctx').innerHTML = `${T.aiAbout} <b>${esc(aiFile ? aiFile.split(/[\\/]/).pop() : T.aiKnowledge)}</b>`;
  $('#ai-clear').hidden = !aiFile;
  $('#ai-quick').innerHTML = (aiFile ? ['qSummary', 'qReq', 'qRisk', 'qDates'] : []).map(k => `<button type="button" class="chip" data-q="${k}">${T[k]}</button>`).join('');
  $('#ai-quick').querySelectorAll('[data-q]').forEach(b => b.onclick = () => askAI(T[b.dataset.q]));
  setMode(aiFile ? 'ask' : aiMode);
  $('#ai-panel').classList.add('open'); $('#ai-panel').setAttribute('aria-hidden', 'false'); $('#ai-q').focus();
}
async function askAI(question) {
  const log = $('#ai-log');
  log.insertAdjacentHTML('beforeend', `<div class="bubble me">${esc(question)}</div><div class="bubble bot pending">${T.aiThinking}</div>`);
  log.scrollTop = log.scrollHeight;
  const pending = log.querySelector('.pending');
  if (!aiApi) {   // not connected to the RH AI API: ask in the RH AI chat itself
    const text = aiFile ? `${question}\n\n(${T.aiAbout} ${aiFile})` : question;
    window.open(`${aiUrl}/?q=${encodeURIComponent(text)}`, '_blank', 'noopener');
    api('/api/ai/chat-log', { method:'POST', body:JSON.stringify({ question, path: aiFile, lang }) }).catch(() => {});
    pending.innerHTML = `${T.aiOpened} <a class="link" href="${esc(aiUrl)}" target="_blank" rel="noopener">${esc(aiUrl.replace(/^https?:\/\//, ''))} ↗</a>`
      + (aiFile ? `<div class="muted small">${T.aiAttach}</div>` : '');
    pending.classList.remove('pending'); log.scrollTop = log.scrollHeight; return;
  }
  try {
    const r = await api('/api/ai/ask', { method:'POST', body:JSON.stringify({ question, path: aiFile, lang }) });
    pending.innerHTML = esc(r.answer).replace(/\n/g, '<br>') + (r.sources?.length ? `<div class="src">${T.aiSources}: ${r.sources.map(esc).join(', ')}</div>` : '');
  } catch (e) {
    pending.innerHTML = `<span style="color:var(--err)">${T.err}: ${esc(e.message)}</span>`
      + `<div class="small"><a class="link" href="${esc(aiUrl)}/?q=${encodeURIComponent(question)}" target="_blank" rel="noopener">${T.aiChat} ↗</a></div>`;
  }
  pending.classList.remove('pending'); log.scrollTop = log.scrollHeight;
}
$('#ai-t').textContent = T.aiInsights; $('#ai-b').title = T.aiInsights; $('#ai-title').textContent = '✦ ' + T.aiInsights; $('#ai-send').textContent = T.aiAsk;
$('#ai-q').placeholder = T.aiPlaceholder; $('#ai-clear').textContent = T.aiClear; $('#ai-chat').textContent = T.aiChat + ' ↗';
$('#ai-b').onclick = () => openAI(null);
$('#ai-x').onclick = () => { $('#ai-panel').classList.remove('open'); $('#ai-panel').setAttribute('aria-hidden', 'true'); };

// RH RAG tools on the AI portal (e.g. QMS): the answer comes into the panel; if the tool does not answer, its page opens.
async function askRag(tool, question) {
  const log = $('#ai-log'), rag = ragTools.find(r => r.tool === tool);
  log.insertAdjacentHTML('beforeend', `<div class="bubble me"><span class="muted small">${esc(tool.toUpperCase())}</span> ${esc(question)}</div><div class="bubble bot pending">${T.aiThinking}</div>`);
  log.scrollTop = log.scrollHeight;
  const pending = log.querySelector('.pending');
  try {
    const r = await api('/api/ai/rag', { method:'POST', body:JSON.stringify({ question, tool, lang }) });
    pending.setAttribute('dir', 'auto');
    pending.innerHTML = mdLite(r.answer) + (r.sources?.length ? `<div class="src">${T.aiSources}: ${r.sources.map(s => `<span title="${esc(s.snippet || '')}">${esc(s.name)}${s.section ? ' | ' + esc(s.section) : ''}${s.file ? ' (' + esc(s.file) + ')' : ''}</span>`).join(' · ')}</div>` : `<div class="src">${esc(tool.toUpperCase())} · RAG</div>`);
  } catch (e) {
    if (rag && /web page/.test(e.message)) {   // the tool is a chat page: show it here, inside AI Insights
      pending.classList.add('wide');
      pending.innerHTML = `<iframe class="rag-frame" src="${esc(rag.page)}&question=${encodeURIComponent(question)}" title="${esc(tool.toUpperCase())}"></iframe>`
        + `<div class="small"><a class="link" href="${esc(rag.page)}" target="_blank" rel="noopener">${T.ragOpen.replace('{tool}', esc(tool.toUpperCase()))} ↗</a></div>`;
    } else {
      pending.innerHTML = `<span style="color:var(--err)">${T.err}: ${esc(e.message)}</span>`
        + (rag ? `<div class="small"><a class="link" href="${esc(rag.page)}" target="_blank" rel="noopener">${T.ragOpen.replace('{tool}', esc(tool.toUpperCase()))} ↗</a></div>` : '');
    }
  }
  pending.classList.remove('pending'); log.scrollTop = log.scrollHeight;
}
// Light markdown of the RAG answers: **bold**, bullets and line breaks (the text is escaped first)
function mdLite(s) {
  return esc(s).split('\n').map(l => {
    const b = l.match(/^(\s*)[*-]\s+(.*)$/);
    l = (b ? b[2] : l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    return b ? `<div style="padding-inline-start:${b[1].length ? 28 : 12}px">• ${l}</div>` : (l ? `<div>${l}</div>` : '<div style="height:6px"></div>');
  }).join('');
}
function addRagTabs() {
  ragTools.forEach(r => {
    $('.dr-tabs').insertAdjacentHTML('beforeend', `<button type="button" data-mode="rag:${esc(r.tool)}">📚 ${esc(r.tool.toUpperCase())}</button>`);
    $('.dr-tabs').lastElementChild.onclick = () => setMode('rag:' + r.tool);
  });
}

$('#m-find').onclick = () => setMode('find'); $('#m-ask').onclick = () => { setMode('ask'); };

// ---------------------------------------------------------------- dialogs
function dialog(title, body, buttons) {
  $('#dlg-h').textContent = title; $('#dlg-b').innerHTML = body;
  $('#dlg-f').innerHTML = buttons.map(([v, label, cls]) => `<button class="pillbtn small ${cls || ''}" value="${v}">${label}</button>`).join('');
  $('#dlg').showModal();
  return new Promise(res => $('#dlg-form').onsubmit = e => { e.preventDefault(); res({ action: e.submitter?.value, form: e.target }); });
}
function note(html, cls) { const m = document.createElement('div'); m.className = 'msg ' + cls; m.innerHTML = html; $('#dlg-b').prepend(m); }
async function uploadDialog(folder) {
  const shown = cfg.repositoryRoot && folder.toLowerCase().startsWith(cfg.repositoryRoot.toLowerCase()) ? folder.slice(cfg.repositoryRoot.length).replace(/^[\\/]/, '') : folder;
  let r = await dialog(T.uploadTitle, `<label>${T.folder}<input type="text" class="ltr" value="${esc(shown)}" title="${esc(folder)}" readonly></label>
      <label>${T.chooseFile}<input type="file" name="file" required></label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="overwrite">${T.overwrite}</label>`,
    [['cancel', T.cancel, 'light'], ['ok', T.ok]]);
  while (r.action === 'ok') {
    const fd = new FormData(r.form); fd.set('folder', folder); fd.set('overwrite', r.form.overwrite.checked ? 'true' : 'false');
    try { const x = await api('/api/files/upload', { method:'POST', body:fd }); $('#dlg').close(); render(); return x; }
    catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); r = await new Promise(res => $('#dlg-form').onsubmit = ev => { ev.preventDefault(); res({ action: ev.submitter?.value, form: ev.target }); }); }
  }
  $('#dlg').close();
}
// New revision of an approved document: from a copy of the approved file or from a file on the PC
async function newRevision(id) {
  const d = await api(`/api/documents/${id}`);
  const cur = d.currentRevision || '01', next = String((parseInt(cur, 10) || 1) + 1).padStart(2, '0');
  let r = await dialog(`${T.newRevTitle} ${d.documentId} - ${d.title}`,
    `<div class="small">${T.revCurrent}: <b>Rev ${esc(cur)}</b> · ${T.revNext}: <b>Rev ${next}</b></div>
     <label style="color:var(--ink)">${T.revFrom}</label>
     <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="radio" name="src" value="copy" checked>${T.revCopy}</label>
     <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="radio" name="src" value="file">${T.revUpload}</label>
     <input type="file" name="file">
     <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="submit">${T.revSubmit}</label>`,
    [['cancel', T.cancel, 'light'], ['ok', T.ok]]);
  while (r.action === 'ok') {
    const fd = new FormData();
    const useFile = r.form.src.value === 'file';
    if (useFile) { if (!r.form.file.files.length) { note(T.chooseFile, 'err'); r = await again(); continue; } fd.set('file', r.form.file.files[0]); }
    fd.set('submit', r.form.submit.checked ? 'true' : 'false');
    try {
      const x = await api(`/api/documents/${id}/revise`, { method:'POST', body:fd });
      $('#dlg').close(); refreshApprovals();
      state.view = 'browse'; state.folder = x.draft.replace(/[\\/][^\\/]+$/, ''); await render();
      if (!r.form.submit.checked && x.officeUri) location.href = x.officeUri;    // open the draft in Excel/Word
      return x;
    } catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); r = await again(); }
  }
  $('#dlg').close();
}
async function shareDialog(id) {

const again = () => new Promise(res => $('#dlg-form').onsubmit = ev => { ev.preventDefault(); res({ action: ev.submitter?.value, form: ev.target }); });
// New document: a file from the PC, saved in this folder and registered (and submitted) in one step
async function newDocument(folder) {
  const [o, bp] = await Promise.all([api('/api/options'), classifyOf(folder)]);
  let r = await dialog(T.newDocTitle, `<label>${T.chooseFile}<input type="file" name="file" required></label>
      <label>${T.titleF}<input type="text" name="title" placeholder="${esc(T.titleF)}"></label>
      <label>${T.type}<select name="documentType">${optSel(o.DocumentType, bp.documentType)}</select></label>
      <label>${T.area}<select name="documentArea">${optSel(o.DocumentArea, bp.documentArea)}</select></label>
      <label>${T.mode}<select name="controlMode">${optSel(o.ControlMode, bp.controlMode)}</select></label>`,
    [['cancel', T.cancel, 'light'], ['save', T.registerOnly, 'light'], ['submit', T.registerSubmit]]);
  while (r.action === 'save' || r.action === 'submit') {
    const f = r.form;
    try {
      const fd = new FormData(); fd.set('folder', folder); fd.set('file', f.file.files[0]); fd.set('overwrite', 'false');
      const up = await api('/api/files/upload', { method:'POST', body:fd });
      await api('/api/documents', { method:'POST', body:JSON.stringify({ path: up.path, title: f.title.value.trim() || null,
        documentType: f.documentType.value, documentArea: f.documentArea.value, controlMode: f.controlMode.value, submit: r.action === 'submit' }) });
      $('#dlg').close(); refreshApprovals(); render(); return;
    } catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); r = await again(); }
  }
  $('#dlg').close();
}
// Options of a choice field, with the value inherited from the blueprint folder preselected and marked
const optSel = (a, sel) => a.map(x => `<option value="${esc(x)}" ${x === sel ? 'selected' : ''}>${esc(x)}${x === sel ? ' ✓ ' + T.bpFrom : ''}</option>`).join('');
const classifyOf = path => api('/api/classify?path=' + encodeURIComponent(path)).catch(() => ({}));
async function startWorkflow(path, name) {
  const [o, bp] = await Promise.all([api('/api/options'), classifyOf(path)]);
  const file = name || path.split(/[\\/]/).pop();
  let r = await dialog(T.start, `<label>${T.file}<input type="text" class="ltr" value="${esc(path)}" readonly></label>
      <label>${T.titleF}<input type="text" name="title" value="${esc(file.replace(/\.[^.]+$/, ''))}" required></label>
      <label>${T.type}<select name="documentType">${optSel(o.DocumentType, bp.documentType)}</select></label>
      <label>${T.area}<select name="documentArea">${optSel(o.DocumentArea, bp.documentArea)}</select></label>
      <label>${T.mode}<select name="controlMode">${optSel(o.ControlMode, bp.controlMode)}</select></label>`,
    [['cancel', T.cancel, 'light'], ['save', T.registerOnly, 'light'], ['submit', T.registerSubmit]]);
  while (r.action === 'save' || r.action === 'submit') {
    const f = Object.fromEntries(new FormData(r.form)); f.path = path; f.submit = r.action === 'submit';
    try {
      const d = await api('/api/documents', { method:'POST', body:JSON.stringify(f) });
      $('#dlg').close(); refreshApprovals(); render();
      return d;
    } catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); r = await new Promise(res => $('#dlg-form').onsubmit = ev => { ev.preventDefault(); res({ action: ev.submitter?.value, form: ev.target }); }); }
  }
  $('#dlg').close();
}
const editActions = f => `<button type="button" class="link" data-rn="${esc(f.path)}">${T.rename}</button><button type="button" class="link" data-del="${esc(f.path)}" style="color:var(--err)">${T.del}</button>`;

const renameDialog = path => simpleDialog(T.rename, T.newName, path.split(/[\\/]/).pop(), '/api/items/rename', newName => ({ path, newName }));
async function deleteItem(path) {

async function download(path) {
  const t = await token();
  const r = await fetch('/api/files/download?path=' + encodeURIComponent(path), { credentials:'include', headers: t ? { Authorization:'Bearer ' + t } : {} });
  if (!r.ok) return alert(T.err);
  Object.assign(document.createElement('a'), { href: URL.createObjectURL(await r.blob()), download: path.split(/[\\/]/).pop() }).click();
}

// ---------------------------------------------------------------- start
(async () => {
  cfg = await (await fetch('/api/client-config')).json();
  if (cfg.authMode === 'entra') {   // only for access from outside the network
    await new Promise((ok, fail) => document.head.appendChild(Object.assign(document.createElement('script'), { src:'https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js', onload:ok, onerror:fail })));
    msal = new msalBrowser.PublicClientApplication({ auth: { clientId: cfg.clientId, authority:'https://login.microsoftonline.com/' + cfg.tenantId, redirectUri: location.origin + location.pathname } });
    await msal.initialize();
    const r = await msal.handleRedirectPromise();
    account = r?.account || msal.getAllAccounts()[0];
    if (!account) return msal.loginRedirect({ scopes:[cfg.scope], state: location.search });
    if (r?.state && !location.search) return location.replace(location.pathname + r.state);
  }
  if (cfg.playground) { $('#pg').hidden = false; $('#pg').textContent = T.pgBanner; }
  else if (cfg.site && cfg.authMode === 'dev') { $('#pg').hidden = false; $('#pg').classList.add('live'); $('#pg').textContent = T.liveBanner.replace('{site}', cfg.site.split('/').pop()).replace('{where}', cfg.approvals === 'page' ? T.apPage : T.apTeams); }
  try { me = await api('/api/me'); $('#who').textContent = (me.name || me.email) + (me.admin ? ' ★' : ''); } catch (e) { $('#who').textContent = ''; }
  try { const st = await api('/api/ai/status'); aiApi = st.enabled; aiUrl = st.url || aiUrl; ragTools = st.rag || []; addRagTabs(); } catch { aiApi = false; }
  $('#ai-chat').href = aiUrl;
  if (me.admin) state.apAll = true;                // super users see every pending approval
  if (me.admin) $('#menu').insertAdjacentHTML('beforeend', `<button data-m="fl">⇪ ${T.flTitle}</button>`);
  if (cfg.approvals === 'page') { $('#ap-b').style.display = ''; refreshApprovals(); setInterval(refreshApprovals, 60000); }
  $('#ai-b').style.display = '';
  $('#ai-log').innerHTML = `<div class="muted small">${T.aiOnPrem}</div>`;
  if (q.get('view') === 'approvals' && cfg.approvals === 'page') state.view = 'approvalsView';   // from a notification link
  else if (q.get('view') === 'workflows') state.view = 'mine';
  await render();
  if (q.get('path')) startWorkflow(q.get('path'), q.get('name'));   // opened from the Explorer right-click
})();
