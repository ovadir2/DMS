<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH - Documents Management System</title>
<style>
  :root { --navy:#1f4a72; --btn:#2a5279; --teal:#3db7b3; --ink:#1d2733; --muted:#6b7684; --line:#d7dde4; --bg:#ffffff; --band:#eef4fa;
          --ok:#1f7a3d; --okbg:#e3f4e8; --warn:#8a5a00; --warnbg:#fff3d6; --info:#1f5fa8; --infobg:#e4eefb; --err:#b42318; --errbg:#fde8e6; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 Roboto, "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  body.busy, body.busy * { cursor:progress !important; }
  #busybar { position:fixed; top:0; inset-inline:0; height:3px; z-index:9999; display:none; overflow:hidden; background:transparent; }
  body.busy #busybar { display:block; }
  #busybar::after { content:""; position:absolute; top:0; height:100%; width:30%; background:var(--accent, #1d6fb8); animation:busy 1s linear infinite; }
  @keyframes busy { from { left:-30%; } to { left:100%; } }
  header { height:76px; display:flex; align-items:center; gap:20px; padding:0 28px; background:#fff; box-shadow:0 2px 10px rgba(31,74,114,.12); position:relative; z-index:2; }
  .brand { display:flex; align-items:center; gap:22px; cursor:pointer; }
  .sep { width:1px; height:26px; background:#9fb0c2; }
  .welcome { font-weight:700; font-size:19px; color:var(--navy); letter-spacing:.2px; }
  .spacer { flex:1; }
  .hbtn { display:flex; align-items:center; gap:6px; color:var(--navy); background:none; border:none; font:inherit; cursor:pointer; padding:6px; }
  .hbtn.muted { color:var(--muted); cursor:default; }
  .menu { position:relative; }
  .menu-list { position:absolute; inset-inline-end:0; top:36px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.12); min-width:190px; display:none; }
  .menu-list.open { display:block; }
  .menu-list button { display:block; width:100%; text-align:start; padding:10px 14px; background:none; border:none; font:inherit; cursor:pointer; color:var(--ink); }
  .menu-list button:hover { background:var(--band); }
  .band { background:linear-gradient(var(--band), #fff 90px); padding:40px 16px 40px; min-height:calc(100vh - 76px); }
  .card { max-width:1570px; margin:0 auto 22px; background:#fff; border-radius:8px; box-shadow:0 2px 12px rgba(31,74,114,.10); padding:22px 24px; }
  .card h2 { margin:0 0 8px; font-size:18px; color:var(--navy); }
  .radios { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:8px; }
  .radios label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .radios input { accent-color:var(--navy); width:17px; height:17px; margin:0; }
  .searchrow { display:flex; gap:16px; align-items:center; }
  .searchbox { flex:1; position:relative; }
  .searchbox input { width:100%; height:47px; border:1px solid var(--line); border-radius:6px; padding:0 44px 0 12px; font:inherit; color:var(--ink); }
  [dir=rtl] .searchbox input { padding:0 12px 0 44px; }
  .searchbox > svg { position:absolute; inset-inline-end:12px; top:13px; }
  .typeahead { position:absolute; top:50px; inset-inline:0; background:#fff; border:1px solid var(--line); border-radius:8px;
               box-shadow:0 8px 24px rgba(20,35,55,.15); z-index:15; max-height:60vh; overflow:auto; padding:4px 0; }
  .typeahead button { display:flex; gap:10px; align-items:center; width:100%; text-align:start; padding:7px 12px; background:none; border:none;
                      font:inherit; cursor:pointer; color:var(--ink); }
  .typeahead button.on, .typeahead button:hover { background:var(--band); }
  .typeahead .ta-n { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .typeahead .ta-p { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:ltr; unicode-bidi:plaintext; }
  .typeahead .ta-t { display:grid; min-width:0; flex:1; }
  [dir=rtl] .typeahead .ta-p { text-align:right; }
  .apsel { display:grid; gap:6px; border-top:1px solid var(--line); padding-top:10px; color:var(--ink); }
  .apsel .chk { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--ink); }
  .apsel #ap-q { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; }
  .apsel .chip button { margin-inline-start:4px; }
  .ap-list { border:1px solid var(--line); border-radius:6px; max-height:220px; overflow:auto; margin-top:6px; }
  .ap-list label, .dlg-b .ap-list label { display:flex; gap:10px; align-items:center; padding:6px 10px; cursor:pointer; color:var(--ink); font-size:14px; }
  .ap-list input { flex:none; margin:0; }
  .ap-list label:hover { background:var(--band); } .ap-list .ta-t { display:grid; min-width:0; }
  .ap-list .ta-n { font-weight:500; } .ap-list .ta-p { font-size:12px; color:var(--muted); direction:ltr; unicode-bidi:plaintext; }
  [dir=rtl] .ap-list .ta-p { text-align:right; }
  .typeahead .ta-all { color:var(--info); font-size:13px; border-top:1px solid var(--line); margin-top:4px; }
  .pillbtn { height:47px; min-width:150px; border-radius:24px; background:var(--btn); color:#fff; border:none; font:inherit; font-weight:500; cursor:pointer; padding:0 26px; }
  .pillbtn:disabled { opacity:.5; cursor:default; }
  .pillbtn.small { height:38px; min-width:0; padding:0 20px; }
  .pillbtn.light { background:#e8eef5; color:var(--navy); }
  .refresh { display:inline-flex; gap:5px; align-items:center; color:var(--info); font-size:13px; margin-top:6px; background:none; border:none; cursor:pointer; padding:0; }
  .crumbs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; color:var(--muted); margin-bottom:12px; }
  .crumbs a { color:var(--info); cursor:pointer; }
  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
  .tile { border:1px solid var(--line); border-radius:8px; padding:14px; cursor:pointer; display:flex; gap:10px; align-items:center; color:var(--navy); font-weight:500; background:#fff; text-align:start; font:inherit; }
  .tile:hover { border-color:var(--btn); box-shadow:0 2px 8px rgba(31,74,114,.12); }
  .tile.folder { align-items:flex-start; width:100%; }
  .tl { display:grid; gap:2px; } .hint { font-size:12.5px; color:var(--muted); font-weight:400; } .fname { font-size:11.5px; color:#98a2ae; font-weight:400; }
  .tilewrap { display:grid; gap:4px; } .tileacts { font-size:13px; padding:0 4px; } .tileacts button { margin-inline-end:10px; }
  .levels { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .levels .gtitle { font-weight:600; color:var(--navy); margin-inline-end:4px; }
  .levels select { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); max-width:260px; }
  .levels select:last-child:has(option[value=""]:checked) { border-color:var(--btn); box-shadow:0 0 0 2px rgba(42,82,121,.15); }
  .lsep { color:var(--muted); }
  .hbtn.ai { color:#6d3fc0; font-weight:500; } button.link.ai { color:#6d3fc0; }
  .drawer { position:fixed; top:0; inset-inline-end:0; height:100vh; width:min(460px, 100vw); background:#fff; box-shadow:-8px 0 30px rgba(20,35,55,.18);
            transform:translateX(110%); transition:transform .2s; z-index:20; display:flex; flex-direction:column; }
  [dir=rtl] .drawer { transform:translateX(-110%); }
  .drawer.open { transform:none !important; }
  .dr-h { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); font-weight:700; color:#6d3fc0; font-size:17px; }
  .dr-ctx { padding:10px 18px; background:#f5f1fc; display:flex; gap:10px; justify-content:space-between; align-items:center; font-size:14px; }
  .dr-q { padding:10px 18px 0; display:flex; flex-wrap:wrap; gap:6px; }
  .dr-log { flex:1; overflow:auto; padding:14px 18px; display:flex; flex-direction:column; gap:10px; }
  .bubble { padding:10px 12px; border-radius:10px; max-width:90%; white-space:normal; line-height:1.5; }
  .bubble.me { align-self:flex-end; background:var(--infobg); }
  .bubble.bot { align-self:flex-start; background:#f4f5f7; }
  .bubble .src { margin-top:6px; font-size:12px; color:var(--muted); }
  .dr-in { display:flex; gap:8px; padding:12px 18px 16px; border-top:1px solid var(--line); align-items:flex-end; }
  .dr-in textarea { flex:1; font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; resize:vertical; }
  .rag-frame { width:100%; height:60vh; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .dr-tabs { display:flex; gap:4px; padding:10px 18px 0; }
  .dr-tabs button { flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px; font:inherit; cursor:pointer; color:var(--ink); }
  .dr-tabs button.on { border-color:#6d3fc0; color:#6d3fc0; font-weight:600; background:#f5f1fc; }
  .bubble.wide { max-width:100%; width:100%; }
  .sugg { border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:#fff; margin-top:8px; display:grid; gap:3px; }
  .sg-n { font-weight:500; } .sg-r { color:#5b3aa0; } .sg-a button, .sg-a a { margin-inline-end:12px; }
  .sugg-list { display:grid; gap:4px; }
  .pg-banner { background:#fff3d6; color:#7a5200; padding:8px 28px; font-size:13.5px; border-bottom:1px solid #f0dca6; }
  .badge { background:var(--err); color:#fff; border-radius:9px; font-size:11px; padding:0 6px; min-width:18px; text-align:center; }
  .pg-banner.live { background:#e3f4e8; color:#1f5f33; border-bottom-color:#bfe3c9; }
  .pg button { margin-inline-end:10px; }
  .pf-res { background:var(--band); border-radius:8px; padding:10px 12px; }
  .pf-path { font-weight:600; color:var(--navy); word-break:break-all; }
  .flform { display:grid; gap:10px; max-width:900px; }
  .flform label { display:grid; gap:4px; color:var(--muted); font-size:13px; }
  .flform fieldset.flmode { border:1px solid var(--line); border-radius:8px; padding:8px 12px; display:grid; gap:6px; }
  .flform fieldset.flmode legend { color:var(--muted); font-size:13px; padding:0 4px; }
  .flform .row { display:flex; gap:10px; align-items:flex-end; width:100%; }
  .flform label.chk { display:flex; gap:8px; align-items:center; color:var(--ink); font-size:14px; }
  .flform input[type=text], .flform select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:16px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; color:var(--ink); }
  .chip.on { border-color:var(--btn); box-shadow:0 0 0 2px rgba(42,82,121,.15); }
  .Rejected { background:var(--errbg); color:var(--err); }
  .timeline { margin:4px 0; padding-inline-start:20px; display:grid; gap:6px; }
  .guide { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--band); border-radius:8px; padding:10px 14px; margin-bottom:12px; }
  .guide .gtitle { font-weight:600; color:var(--navy); }
  .guide select { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; min-width:220px; background:#fff; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:start; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  td.actions { white-space:nowrap; }
  td.actions a, td.actions button.link { margin-inline-end:12px; }
  a.link, button.link { color:var(--info); cursor:pointer; text-decoration:none; background:none; border:none; font:inherit; padding:0; }
  .status { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12.5px; font-weight:500; }
  .Working { background:var(--warnbg); color:var(--warn); } .Submitted { background:var(--infobg); color:var(--info); }
  .Approved_ReadOnly { background:var(--okbg); color:var(--ok); } .None, .Other { background:#f0f2f5; color:var(--muted); }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .msg { padding:10px 12px; border-radius:6px; margin-bottom:12px; } .msg.ok { background:var(--okbg); color:var(--ok); } .msg.err { background:var(--errbg); color:var(--err); }
  dialog { border:none; border-radius:10px; padding:0; width:min(560px, 94vw); box-shadow:0 12px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(20,35,55,.35); }
  .dlg-h { padding:16px 20px; border-bottom:1px solid var(--line); font-weight:700; color:var(--navy); }
  .dlg-b { padding:16px 20px; display:grid; gap:12px; }
  .dlg-f { padding:12px 20px 18px; display:flex; gap:10px; justify-content:flex-end; }
  .dlg-b label { display:grid; gap:4px; color:var(--muted); font-size:13px; }
  .dlg-b input[type=text], .dlg-b select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  .ltr { direction:ltr; unicode-bidi:plaintext; }
  .icon { flex:none; }
  /* ---------------- adaptive layout: desktop, tablet, phone */
  html, body { overflow-x:clip; }
  @media (max-width:1100px) {
    header { gap:12px; padding:0 18px; }
    #wf-t, #lang-t { display:none; }                      /* icons only; the title stays in the tooltip */
    .hbtn { white-space:nowrap; } .brand { min-width:0; } .welcome { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card { padding:18px; }
    td.actions { white-space:normal; } td.actions a, td.actions button.link { display:inline-block; margin-block:2px; }
  }
  @media (max-width:760px) {
    header { height:auto; min-height:58px; flex-wrap:wrap; padding:6px 10px; gap:4px; }
    .brand { gap:10px; min-width:0; flex:1 1 auto; } .sep { display:none; }
    .welcome { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .spacer { display:none; }
    #ap-t, #wf-t, #ai-t, #lang-t, #who { display:none; }
    .hbtn { padding:8px; }
    .pg-banner { padding:8px 12px; font-size:13px; }
    .band { padding:12px 8px 24px; min-height:auto; }
    .card { padding:14px 12px; margin-bottom:12px; }
    .searchrow { flex-direction:column; align-items:stretch; gap:10px; } .searchrow .pillbtn { width:100%; }
    .toolbar { flex-wrap:wrap; gap:8px; } .toolbar .spacer { display:none; }
    .toolbar .pillbtn { flex:1 1 auto; padding:0 12px; }
    .grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
    .tile { padding:11px; }
    .levels select, .guide select { flex:1 1 140px; max-width:100%; min-width:0; }
    .lsep { display:none; }
    td.hide-s, th.hide-s { display:none; }
    /* tables become one card per row */
    table, tbody, tr, td { display:block; width:100%; }
    tr:has(> th) { display:none; }
    tr[hidden] { display:none; }
    tr { border-bottom:1px solid var(--line); padding:8px 2px; }
    td { border:none; padding:2px 0; }
    td.actions { white-space:normal; display:flex; flex-wrap:wrap; gap:6px 14px; padding-top:6px; }
    td.actions a, td.actions button.link { margin:0; }
    .flform .row { flex-direction:column; align-items:stretch; }
    .dlg-f { flex-wrap:wrap; } .dlg-f .pillbtn { flex:1 1 auto; }
    .dr-tabs { padding:8px 10px 0; } .dr-tabs button { padding:6px 4px; font-size:13px; }
    .dr-h, .dr-ctx, .dr-log, .dr-in { padding-inline:12px; }
    .rag-frame { height:55vh; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/dms/logo.png" alt="rh" height="30" onerror="this.nextElementSibling.style.display='';this.remove()"><svg style="display:none" direction="ltr" width="52" height="28" viewBox="0 0 52 28" aria-label="rh"><text x="0" y="23" font-family="Arial Black, Arial" font-weight="900" font-style="italic" font-size="26" fill="#1f4a72">rh</text><path d="M37 2h13l-4 10z" fill="#3db7b3"/></svg>
    <span class="sep"></span>
    <span class="welcome" id="t-welcome"></span>
  </div>
  <span class="spacer"></span>
  <button class="hbtn" id="ap-b" style="display:none"><svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg><span id="ap-t"></span><span class="badge" id="ap-n" hidden></span></button>
  <button class="hbtn" id="wf-b"><svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h10M4 12h7M4 18h10"/><path d="m15 15 2.5 2.5L22 13"/></svg><span id="wf-t"></span></button>
  <button class="hbtn ai" id="ai-b" style="display:none"><svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg><span id="ai-t"></span></button>
  <button class="hbtn" id="lang"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span id="lang-t"></span></button>
  <span class="hbtn muted"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="who"></span></span>
  <div class="menu"><button class="hbtn" id="menu-b" aria-label="menu"><svg width="6" height="22" viewBox="0 0 6 22" fill="#1f4a72"><circle cx="3" cy="3" r="2.4"/><circle cx="3" cy="11" r="2.4"/><circle cx="3" cy="19" r="2.4"/></svg></button>
    <div class="menu-list" id="menu"></div></div>
</header>

<div class="pg-banner" id="pg" hidden></div>
<div class="band">
  <section class="card">
    <h2 id="t-search"></h2>
    <div class="searchrow">
      <div class="searchbox"><input id="q" autocomplete="off"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5d6675" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></div>
      <button class="pillbtn" id="go"></button>
    </div>
    <button class="refresh" id="refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span id="t-refresh"></span></button>
  </section>
  <section class="card" id="view"></section>
</div>

<aside id="ai-panel" class="drawer" aria-hidden="true">
  <div class="dr-h"><span id="ai-title"></span><button type="button" class="hbtn" id="ai-x" aria-label="close">✕</button></div>
  <div class="dr-tabs"><button type="button" data-mode="ask" id="m-ask"></button></div>
  <div class="dr-ctx"><span id="ai-ctx"></span><button type="button" class="link small" id="ai-clear"></button></div>
  <div class="dr-q" id="ai-quick"></div>
  <div class="dr-log" id="ai-log"></div>
  <form class="dr-in" id="ai-form"><textarea id="ai-q" rows="2"></textarea><button class="pillbtn small" id="ai-send"></button></form>
</aside>
<dialog id="dlg"><form method="dialog" id="dlg-form"><div class="dlg-h" id="dlg-h"></div><div class="dlg-b" id="dlg-b"></div><div class="dlg-f" id="dlg-f"></div></form></dialog>

<script>
const q = new URLSearchParams(location.search);
const lang = (q.get('lang') || 'EN').toUpperCase() === 'HE' ? 'HE' : 'EN';
document.documentElement.lang = lang.toLowerCase();
document.documentElement.dir = lang === 'HE' ? 'rtl' : 'ltr';
const T = {
  EN: { welcome:'RH - Documents Management System', search:'Search', all:'All', customer:'Customer', project:'Product', document:'Document ID', file:'File', description:'Description',
        go:'Search', refresh:'Refresh', lang:'English', customers:'Customers', myDocs:'My documents', home:'Home', goBack:'Back', noAccess:'No customers are available to you.',
        name:'Name', status:'Status', modified:'Modified', actions:'', open:'Open', openEdit:'Open to edit (remarks)', download:'Download', start:'Start workflow', submit:'Submit for approval',

}

// The clipboard API needs https; on an http intranet address fall back to a hidden text box.
// The path users copy: $Root\02_Customers\... -> its short path (DMS_SHORT_PATHS)
function userPath(p) {
  const root = (cfg.root || '').replace(/[\\/]+$/, '');
  const mine = myDrives().split(';').filter(x => x.includes('=')).map(x => { const [f, d] = x.split('='); return [root + '\\' + f.trim(), d.trim().replace(/[\\/]+$/, '')]; });
  for (const [long, short] of [...mine, ...(cfg.shortPaths || [])].sort((a, b) => b[0].length - a[0].length)) {
    const l = long.replace(/[\\/]+$/, '');
    if (p && (p.toLowerCase() === l.toLowerCase() || p.toLowerCase().startsWith(l.toLowerCase() + '\\'))) return short + p.slice(l.length);
  }
  return p;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return; } catch (e) { /* fall back */ }
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
}

// Back: the DMS keeps its own trail of the screens visited (the browser Back button works too)
let navKey = null, popping = false, navCur = null;
const navTrail = [];
window.addEventListener('popstate', e => {
  const st = e.state && e.state.dms ? e.state : { view: 'customers', folder: null };
  navTrail.pop();
  state.view = st.view; state.folder = st.folder; popping = true; render();
});
function goBack() {
  const prev = navTrail.pop() || { view: 'customers', folder: null };
  state.view = prev.view; state.folder = prev.folder; popping = true; render();
}
async function render() {
  const key = state.view + '|' + (state.view === 'browse' ? state.folder || '' : '');
  if (key !== navKey) {
    const st = { dms: 1, view: state.view, folder: state.folder };
    if (!popping && navCur) navTrail.push(navCur);
    navCur = { view: state.view, folder: state.folder };
    try { navKey === null || popping ? history.replaceState(st, '') : history.pushState(st, ''); } catch (e) { /* ignore */ }
    navKey = key;
  }
  popping = false;
  const v = $('#view');
  v.innerHTML = '<span class="muted">…</span>';
  try { await ({ customers, browse, search, mine, approvalsView, firstLoad, spcheck })[state.view](v); wire(v); }

}

async function delegateDialog(d) {
  const behalf = !d.mine && d.pending.length ? `<label>${T.dgFrom}<select name="from">${d.pending.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></label>` : '';
  const opened = dialog(`${T.dgTitle} ${d.documentId}`, `${behalf}
      <div class="apsel"><span class="muted small">${T.dgTo.replace('{n}', cfg.delegationDays || 3)}</span><div class="chips" id="dg-sel"></div>
        <input type="text" id="ap-q" placeholder="${esc(T.apSearch)}" autocomplete="off"><div class="ap-list" id="ap-list"></div></div>
      <label>${T.apComment}<input type="text" name="comment"></label>`, [['cancel', T.cancel, 'light'], ['ok', T.dgBtn]]);
  const box = $('#dlg-b'), q = box.querySelector('#ap-q'), listEl = box.querySelector('#ap-list');
  let base = [], found = [], pick = null, timer, seq = 0;
  const draw = () => {
    const text = q.value.trim().toLowerCase(), seen = new Set();
    const rows = [...found, ...base].filter(p => !seen.has(p.email) && seen.add(p.email) && (!text || found.includes(p) || (p.name + ' ' + p.email).toLowerCase().includes(text)));
    listEl.innerHTML = rows.map(p => `<label><input type="radio" name="dg" data-e="${esc(p.email)}" ${pick && pick.email === p.email ? 'checked' : ''}>
      <span class="ta-t"><span class="ta-n">${esc(p.name)}</span><span class="ta-p">${esc(p.email)}${p.title ? ' · ' + esc(p.title) : ''}</span></span></label>`).join('') || `<div class="muted small" style="padding:8px">${T.noneFound}</div>`;
    listEl.querySelectorAll('[data-e]').forEach(r => r.onchange = () => { pick = rows.find(p => p.email === r.dataset.e); box.querySelector('#dg-sel').innerHTML = `<span class="chip on">${esc(pick.name)}</span>`; });
  };
  q.oninput = () => { draw(); clearTimeout(timer); const text = q.value.trim(); if (text.length < 2) { found = []; return; }
    timer = setTimeout(async () => { const n = ++seq; let r = []; try { r = await api('/api/people?q=' + encodeURIComponent(text)); } catch {} if (n === seq) { found = r; draw(); } }, 300); };
  q.onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
  try { base = await api('/api/people/list'); } catch {} draw();
  let r = await opened;
  while (r.action === 'ok') {
    if (!pick) { note(T.dgNone, 'err'); r = await again(); continue; }
    try {
      await api(`/api/approvals/${d.id}/delegate`, { method:'POST', body:JSON.stringify({ to: pick.email, from: r.form.from ? r.form.from.value : null, comment: r.form.comment.value }) });
      $('#dlg').close(); refreshApprovals(); render(); return;
    } catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); r = await again(); }
  }
  $('#dlg').close();
}

// Path finder: build a path level by level from the blueprint, including folders that do not exist yet
async function pathFinder(start, onPick) {
  const root = (cfg.repositoryRoot || '').replace(/[\\/]$/, '');
  const sep = root.includes('\\') ? '\\' : '/';
  // the chain of selected folders from the root down to `start`
  let chain = [];
  if (start && root && start.toLowerCase().startsWith(root.toLowerCase())) {
    const parts = start.slice(root.length).split(/[\\/]/).filter(Boolean);
    chain = parts.map((_, i) => root + sep + parts.slice(0, i + 1).join(sep));
  }
  $('#dlg-h').textContent = '🧭 ' + T.pathFinder;
  $('#dlg-f').innerHTML = `<button class="pillbtn small light" value="close">${T.pfClose}</button>`;
  $('#dlg-form').onsubmit = e => { e.preventDefault(); $('#dlg').close(); };
  if (!$('#dlg').open) $('#dlg').showModal();
  async function draw() {
    const levels = [];
    for (let i = 0; i <= chain.length; i++) {
      const at = i ? chain[i - 1] : null;
      const r = await api('/api/pathfinder' + (at ? '?path=' + encodeURIComponent(at) : ''));
      levels.push({ r, selected: chain[i] });
      if (!r.options.length) break;
    }
    const last = levels[levels.length - 1].r;
    const here = chain.length ? (levels[chain.length] ? levels[chain.length].r : last) : null;
    const target = chain[chain.length - 1];
    const exists = here ? here.exists : false;
    $('#dlg-b').innerHTML = `<p class="muted small" style="margin:0">${T.pfIntro}</p>
      ${levels.map((l, i) => l.r.options.length ? `<label>${i ? esc(lbl(l.r.node) || l.r.relative.split(/[\\/]/).pop()) : T.location}
        <select data-pf="${i}"><option value="">${T.choose}</option>${l.r.options.map(o => `<option value="${esc(o.path)}" ${o.path === l.selected ? 'selected' : ''}>${esc(lbl(o.label) || o.name)}${o.exists ? '' : ` (${T.pfNew})`}</option>`).join('')}</select></label>` : '').join('')}
      ${target ? `<div class="pf-res"><div class="muted small">${T.pfResult}</div><div class="ltr pf-path">${esc(target.slice(root.length).replace(/^[\\/]/, ''))}</div>
        ${exists ? '' : `<div class="small" style="color:var(--warn)">${T.pfMissing}</div>`}
        <div class="row" style="margin-top:8px">
          ${exists ? `<button type="button" class="pillbtn small" id="pf-go">${T.pfGo}</button>` : `<button type="button" class="pillbtn small" id="pf-create">${T.pfCreate}</button>`}
          ${exists && here.canWrite ? `<button type="button" class="pillbtn small light" id="pf-up">${T.pfUpload}</button>` : ''}
          <button type="button" class="pillbtn small light" id="pf-copy">${T.copy}</button></div></div>` : ''}`;
    $('#dlg-b').querySelectorAll('[data-pf]').forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.pf;
      chain = chain.slice(0, i);
      if (sel.value) chain.push(sel.value);
      draw().catch(e => note(`${T.err}: ${esc(e.message)}`, 'err'));
    });
    const go = path => { $('#dlg').close(); if (onPick) return onPick(path); state.view = 'browse'; state.folder = path; render(); };
    const g = $('#pf-go'); if (g) g.onclick = () => go(target);
    const u = $('#pf-up'); if (u) u.onclick = async () => { go(target); setTimeout(() => uploadDialog(target), 400); };
    const cr = $('#pf-create'); if (cr) cr.onclick = async () => {
      try { await api('/api/pathfinder/create?path=' + encodeURIComponent(target), { method:'POST' }); go(target); }
      catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); }
    };
    const cp = $('#pf-copy'); if (cp) cp.onclick = async () => { await copyText(target); cp.textContent = T.copied; };
  }
  try { await draw(); } catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); }
}

// Light markdown of the RAG answers: **bold**, bullets and line breaks (the text is escaped first)
function mdLite(s) {
  return esc(s).split('\n').map(l => {
    const b = l.match(/^(\s*)[*-]\s+(.*)$/);
    l = (b ? b[2] : l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    return b ? `<div style="padding-inline-start:${b[1].length ? 28 : 12}px">• ${l}</div>` : (l ? `<div>${l}</div>` : '<div style="height:6px"></div>');
  }).join('');
}

function wireApprovers(box, initial = []) {
  const chosen = new Map(), q = box.querySelector('#ap-q'), listEl = box.querySelector('#ap-list'), typeSel = box.querySelector('[name=documentType]');
  let base = null, found = [], timer, seq = 0;
  const short = e => e.split('@')[0];
  const chips = () => box.querySelector('#ap-chips').innerHTML = [...chosen.values()].map(p =>
    `<span class="chip on">${esc(p.name)} <button type="button" class="link" data-x="${esc(p.email)}" aria-label="remove">✕</button></span>`).join('')
    || `<span class="muted small">${T.apNone}</span>`;
  const draw = () => {
    const text = q.value.trim().toLowerCase();
    const seen = new Set(), rows = [];
    for (const p of [...chosen.values(), ...(base || []), ...found]) {
      if (seen.has(p.email)) continue;
      if (text && !(p.name + ' ' + p.email).toLowerCase().includes(text) && !found.includes(p)) continue;
      seen.add(p.email); rows.push(p);
    }
    listEl.innerHTML = rows.length ? rows.map(p => `<label><input type="checkbox" data-e="${esc(p.email)}" ${chosen.has(p.email) ? 'checked' : ''}>
        <span class="ta-t"><span class="ta-n">${esc(p.name)}</span><span class="ta-p">${esc(p.email)}${p.title ? ' · ' + esc(p.title) : ''}</span></span></label>`).join('')
      : `<div class="muted small" style="padding:8px">${base ? T.noneFound : T.aiThinking}</div>`;
    listEl.querySelectorAll('[data-e]').forEach(cb => cb.onchange = () => {
      const p = rows.find(r => r.email === cb.dataset.e);
      cb.checked ? chosen.set(p.email, p) : chosen.delete(p.email); chips();
    });
  };
  box.querySelector('#ap-chips').onclick = e => { const x = e.target.dataset.x; if (x) { chosen.delete(x); chips(); draw(); } };
  const matrix = async () => {
    try {
      const r = await api('/api/approver-rule?documentType=' + encodeURIComponent(typeSel.value));
      const ppl = [...new Set([...r.mandatory, ...(r.final ? [r.final] : [])])].map(short).join(', ');
      box.querySelector('#ap-matrix').textContent = `${T.apMatrix}: ${ppl || '-'}${r.fallback ? ' (' + T.apFallback + ')' : ''}`;
    } catch { box.querySelector('#ap-matrix').textContent = ''; }
  };
  typeSel.addEventListener('change', matrix); matrix();
  box.querySelector('#ap-on').onchange = async e => {
    box.querySelector('#ap-pick').hidden = !e.target.checked;
    if (!e.target.checked) return;
    chips(); draw(); q.focus();
    if (!base) { try { base = await api('/api/people/list'); } catch { base = []; } draw(); }
  };
  q.oninput = () => {
    draw(); clearTimeout(timer);
    const text = q.value.trim();
    if (text.length < 2) { found = []; return; }
    timer = setTimeout(async () => {                       // also the whole company directory
      const n = ++seq;
      let r = [];
      try { r = await api('/api/people?q=' + encodeURIComponent(text)); } catch {}
      if (n === seq) { found = r; draw(); }
    }, 300);
  };
  q.onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
  if (initial.length) {                                   // the approvers chosen last time
    initial.forEach(e => chosen.set(e, { email: e, name: short(e), title: '' }));
    const on = box.querySelector('#ap-on'); on.checked = true; on.onchange({ target: on });
  }
  return () => box.querySelector('#ap-on').checked ? [...chosen.keys()] : null;
}

      <label>${T.titleF}<input type="text" name="title" value="${esc(file.replace(/\.[^.]+$/, ''))}" required></label>
      <label>${T.type}<select name="documentType">${optSel(o.DocumentType, bp.documentType)}</select></label>
      <label>${T.area}<select name="documentArea">${optSel(o.DocumentArea, bp.documentArea)}</select></label>
      <label>${T.mode}<select name="controlMode">${optSel(o.ControlMode, bp.controlMode)}</select></label>${AP_FIELD()}`,
    [['cancel', T.cancel, 'light'], ['save', T.registerOnly, 'light'], ['submit', T.registerSubmit]]);
  const pickedAp = wireApprovers($('#dlg-b'));
  let r = await opened;
  while (r.action === 'save' || r.action === 'submit') {
    const f = Object.fromEntries(new FormData(r.form)); f.path = path; f.submit = r.action === 'submit'; f.approvers = pickedAp();
    if (f.submit && f.approvers && !f.approvers.length) { note(T.apNone, 'err'); r = await again(); continue; }
    try {
      const d = await api('/api/documents', { method:'POST', body:JSON.stringify(f) });
      $('#dlg').close(); refreshApprovals(); render();
      return d;
    } catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); r = await new Promise(res => $('#dlg-form').onsubmit = ev => { ev.preventDefault(); res({ action: ev.submitter?.value, form: ev.target }); }); }
  }
  $('#dlg').close();
}
const editActions = f => `<button type="button" class="link" data-rn="${esc(f.path)}">${T.rename}</button><button type="button" class="link" data-del="${esc(f.path)}" style="color:var(--err)">${T.del}</button>`;
async function simpleDialog(title, label, value, url, body) {
  let r = await dialog(title, `<label>${label}<input type="text" name="v" value="${esc(value)}" required></label>`, [['cancel', T.cancel, 'light'], ['ok', T.ok]]);
  while (r.action === 'ok') {
    try { await api(url, { method:'POST', body:JSON.stringify(body(r.form.v.value.trim())) }); $('#dlg').close(); render(); return; }
    catch (e) { note(`${T.err}: ${esc(e.message)}`, 'err'); r = await new Promise(res => $('#dlg-form').onsubmit = ev => { ev.preventDefault(); res({ action: ev.submitter?.value, form: ev.target }); }); }
  }
  $('#dlg').close();
}
const newFolderDialog = parent => simpleDialog(T.newFolder, T.folderName, '', '/api/folders', name => ({ parent, name }));
const renameDialog = path => simpleDialog(T.rename, T.newName, path.split(/[\\/]/).pop(), '/api/items/rename', newName => ({ path, newName }));
// Release without workflow (one row or the ticked files): Not registered, In Work or Submitted
async function releasePaths(paths) {
  if (!paths.length) return alert(T.relNone);
  if (!confirm(T.relNwQ.replace('{n}', paths.length))) return;
  try {
    const r = await api('/api/files/release', { method:'POST', body:JSON.stringify({ paths }) });
    const bad = r.results.filter(x => !x.ok);
    alert(`${T.relDone}: ${r.results.length - bad.length}` + (bad.length ? `\n\n${bad.map(x => `${x.path.split(/[\\/]/).pop()}: ${x.error}`).join('\n')}` : ''));
  } catch (e) { alert(`${T.err}: ${e.message}`); }
  render();
}
// Download several files: the list, then one click
async function downloadDialog(paths) {
  const r = await dialog(`${T.download} (${paths.length} ${T.shareFiles})`,
    `<div class="small" style="max-height:260px;overflow:auto">${paths.map(p => `<div>📄 ${esc(p.split(/[\\/]/).pop())}</div>`).join('')}</div>`,
    [['cancel', T.cancel, 'light'], ['ok', T.download]]);
  $('#dlg').close();
  if (r.action === 'ok') for (const p of paths) await download(p);
}
// Start workflow for several files at once: one type / area / approvers for all, each file its own document
async function startWorkflowMany(paths) {
  const [o, bp] = await Promise.all([api('/api/options'), classifyOf(paths[0])]);
  const opened = dialog(`${T.start} (${paths.length} ${T.shareFiles})`, `<div class="small" style="max-height:120px;overflow:auto">${paths.map(p => `<div>📄 ${esc(p.split(/[\\/]/).pop())}</div>`).join('')}</div>
      <label>${T.type}<select name="documentType">${optSel(o.DocumentType, bp.documentType)}</select></label>
      <label>${T.area}<select name="documentArea">${optSel(o.DocumentArea, bp.documentArea)}</select></label>
      <label>${T.mode}<select name="controlMode">${optSel(o.ControlMode, bp.controlMode)}</select></label>${AP_FIELD()}`,
    [['cancel', T.cancel, 'light'], ['save', T.registerOnly, 'light'], ['submit', T.registerSubmit]]);
  const pickedAp = wireApprovers($('#dlg-b'));
  let r = await opened;
  while (r.action === 'save' || r.action === 'submit') {
    const f = Object.fromEntries(new FormData(r.form)), approvers = pickedAp(), submit = r.action === 'submit';
    if (submit && approvers && !approvers.length) { note(T.apNone, 'err'); r = await again(); continue; }
    const ok = [], bad = [];
    for (const path of paths) {
      const name = path.split(/[\\/]/).pop();
      try { const d = await api('/api/documents', { method:'POST', body:JSON.stringify({ ...f, path, title: name.replace(/\.[^.]+$/, ''), submit, approvers }) }); ok.push(d.documentId); }
      catch (e) { bad.push(`${name}: ${e.message}`); }
    }
    $('#dlg').close(); refreshApprovals(); render();
    alert(`${T.registered} ${ok.join(', ') || '-'}` + (bad.length ? `\n\n${bad.join('\n')}` : ''));
    return;
  }
  $('#dlg').close();
}
// Several files at once: the check boxes in front of the names
function wireSelection(v) {
  const boxes = [...v.querySelectorAll('input.sel')], bar = v.querySelector('#selbar'), all = v.querySelector('#sel-all');
  if (!bar) return;
  const chosen = () => boxes.filter(b => b.checked);
  const update = () => {
    const c = chosen(), n = c.length, free = c.some(b => b.dataset.free), doc = c.some(b => b.dataset.doc);
    bar.style.display = n ? 'flex' : 'none'; v.querySelector('#selcount').textContent = `${n} ${T.selected}`; all.checked = n && n === boxes.length;
    // dark = applies to the ticked files; grey = does not (e.g. Release for a file already in a workflow)
    [['#sel-wf', free], ['#sel-rel', c.some(b => b.dataset.rel)], ['#sel-del', free], ['#sel-share', doc], ['#sel-dl', n], ['#sel-cp', n]].forEach(([id, on]) => {
      const b = v.querySelector(id); if (!b) return;
      if (id !== '#sel-del') b.classList.toggle('light', !on);   // Delete stays light (red)
      b.disabled = !on; b.style.opacity = on ? '' : '.45';
      b.title = on ? '' : (id === '#sel-share' ? T.shareNone : T.relNone);
    });
  };
  boxes.forEach(b => b.onchange = update);
  all.onchange = () => { boxes.forEach(b => b.checked = all.checked); update(); };
  const sh = v.querySelector('#sel-share'); if (sh) sh.onclick = () => {
    const ids = chosen().map(b => +b.dataset.doc).filter(Boolean);
    if (!ids.length) return alert(T.shareNone);
    shareDialog(ids[0], ids.slice(1));
  };
  // a command in a ticked row, while several files are ticked: for all of them
  const table = boxes.length ? boxes[0].closest('table') : null;
  const bulk = { st: '#sel-wf', relp: '#sel-rel', dl: '#sel-dl', del: '#sel-del', share: '#sel-share' };   // Open, Copy path, New revision: the row
  if (table) table.addEventListener('click', ev => {
    const a = ev.target.closest('[data-st],[data-relp],[data-dl],[data-del],[data-share]');
    const row = a && a.closest('tr'), box = row && row.querySelector('input.sel');
    if (!a || !box || !box.checked || chosen().length < 2) return;
    const key = Object.keys(bulk).find(k => a.hasAttribute('data-' + k)), btn = key && v.querySelector(bulk[key]);
    if (!btn) return;
    ev.preventDefault(); ev.stopPropagation(); btn.click();
  }, true);
  const wf = v.querySelector('#sel-wf'); if (wf) wf.onclick = () => {
    const paths = chosen().filter(b => b.dataset.free).map(b => b.dataset.path);
    if (!paths.length) return alert(T.relNone);
    startWorkflowMany(paths);
  };
  const cp = v.querySelector('#sel-cp'); if (cp) cp.onclick = async () => { await copyText(chosen().map(b => userPath(b.dataset.path)).join('\r\n')); cp.textContent = T.copied; };
  const dl = v.querySelector('#sel-dl'); if (dl) dl.onclick = () => downloadDialog(chosen().map(b => b.dataset.path));
  const rel = v.querySelector('#sel-rel'); if (rel) rel.onclick = () => releasePaths(chosen().filter(b => b.dataset.rel).map(b => b.dataset.path));
  const del = v.querySelector('#sel-del'); if (del) del.onclick = async () => {
    const paths = chosen().filter(b => b.dataset.free).map(b => b.dataset.path);
    if (!paths.length) return alert(T.relNone);
    if (!confirm(T.delSelQ.replace('{n}', paths.length))) return;
    const errs = [];
    for (const path of paths) { try { await api('/api/items/delete', { method:'POST', body:JSON.stringify({ path }) }); } catch (e) { errs.push(`${path.split(/[\\/]/).pop()}: ${e.message}`); } }
    if (errs.length) alert(errs.join('\n'));
    render();
  };
}
async function deleteItem(path) {
  if (!confirm(`${path.split(/[\\/]/).pop()}\n${T.confirmDel}`)) return;
  try { await api('/api/items/delete', { method:'POST', body:JSON.stringify({ path }) }); render(); }
  catch (e) { alert(`${T.err}: ${e.message}`); }
}
async function fileBlob(path) {
  const t = await token();
  const r = await fetch('/api/files/download?path=' + encodeURIComponent(path), { credentials:'include',
    headers: { ...(t ? { Authorization:'Bearer ' + t } : {}), ...(devUser() ? { 'X-DMS-Dev-User': devUser() } : {}) } });
  return r.ok ? r.blob() : null;
}
async function download(path) {
  const b = await fileBlob(path);
  if (!b) return alert(T.err);
  Object.assign(document.createElement('a'), { href: URL.createObjectURL(b), download: path.split(/[\\/]/).pop() }).click();
}
// PDF, pictures and text open in a new browser tab (Office files open in Word / Excel / PowerPoint)
const VIEW_EXT = /\.(pdf|png|jpe?g|gif|bmp|svg|txt|log)$/i;
async function viewFile(path) {
  const w = window.open('', '_blank');                     // opened now, so the browser does not block it
  const b = await fileBlob(path);
  if (!b) { if (w) w.close(); return alert(T.err); }
  const url = URL.createObjectURL(b);
  if (w) w.location = url; else location.href = url;
}

// ---------------------------------------------------------------- start
(async () => {
  cfg = await (await fetch('/api/client-config')).json();
  if (cfg.authMode === 'entra') {   // only for access from outside the network
    await new Promise((ok, fail) => document.head.appendChild(Object.assign(document.createElement('script'), { src:'https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js', onload:ok, onerror:fail })));
    msal = new msalBrowser.PublicClientApplication({ auth: { clientId: cfg.clientId, authority:'https://login.microsoftonline.com/' + cfg.tenantId, redirectUri: location.origin + location.pathname } });
    await msal.initialize();
    const r = await msal.handleRedirectPromise();
    account = r?.account || msal.getAllAccounts()[0];
    if (!account) return msal.loginRedirect({ scopes:[cfg.scope], state: location.search });
    if (r?.state && !location.search) return location.replace(location.pathname + r.state);
  }
  if (cfg.playground) { $('#pg').hidden = false; $('#pg').textContent = T.pgBanner; }
  else if (cfg.site && cfg.authMode === 'dev') { $('#pg').hidden = false; $('#pg').classList.add('live'); $('#pg').textContent = T.liveBanner.replace('{site}', cfg.site.split('/').pop()).replace('{where}', cfg.approvals === 'page' ? T.apPage : T.apTeams); }
  try { me = await api('/api/me'); $('#who').textContent = (me.name || me.email) + (me.admin ? ' ★' : '') + (me.actingFrom ? ` (${T.actingAs}: ${me.actingFrom.split('@')[0]})` : ''); } catch (e) { $('#who').textContent = ''; }
  if (!me.actingUsers && devUser()) { try { localStorage.removeItem('dmsDevUser'); } catch (x) {} }   // not a super user: no Acting as
  if (me.actingUsers) $('#menu').insertAdjacentHTML('beforeend', `<button data-m="actas">👤 ${T.actingAs}${me.actingFrom ? ': ' + esc(me.email.split('@')[0]) : ''}</button>`);
  try { const st = await api('/api/ai/status'); aiApi = st.enabled; aiUrl = st.url || aiUrl; ragTools = st.rag || []; addRagTabs(); } catch { aiApi = false; }
  if (me.admin) state.apAll = true;                // super users see every pending approval
  if (me.admin) $('#menu').insertAdjacentHTML('beforeend', `<button data-m="fl">⇪ ${T.flTitle}</button><button data-m="spcheck">🩺 ${T.spCheck}</button>`);
  if (cfg.approvals === 'page') { $('#ap-b').style.display = ''; refreshApprovals(); setInterval(refreshApprovals, 60000); }
  $('#ai-b').style.display = '';
  $('#ai-log').innerHTML = `<div class="muted small">${T.aiOnPrem}</div>`;
  if (q.get('view') === 'approvals' && cfg.approvals === 'page') state.view = 'approvalsView';   // from a notification link
  else if (q.get('view') === 'workflows') state.view = 'mine';
  await render();
  if (q.get('path')) startWorkflow(q.get('path'), q.get('name'));   // opened from the Explorer right-click
})();
</script>
